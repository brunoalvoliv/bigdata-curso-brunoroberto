
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introdução Big Data - MBA/UFC — DIA 3</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2b3444;
  --ink:#e6edf3; --ink2:#9fb0c3; --ink3:#6b7c91;
  --exec:#4a90e2; --tech:#2ecc71; --gold:#f5a623; --danger:#e5484d;
  --aqua:#50e3c2; --purple:#a371f7; --dot:rgba(255,255,255,.028);
  --mono:'SF Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
  --sans:'Segoe UI',system-ui,-apple-system,sans-serif;
}
/* ---------- TEMA CLARO ---------- */
body.light{
  --bg:#f7f9fb; --panel:#ffffff; --panel2:#eaeef3; --line:#c4ccd6;
  --ink:#0b0e12; --ink2:#3a424c; --ink3:#616a75;
  --dot:rgba(12,24,44,.055);
}
#themeBtn{background:none;border:1px solid var(--line);color:var(--ink2);
  padding:7px 11px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1}
#themeBtn:hover{background:var(--panel2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px;color:var(--ink);font-family:var(--sans);overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ---- stage ---- */
#stage{height:100vh;display:flex;flex-direction:column}
#slideWrap{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:48px 60px 30px;display:none;flex-direction:column;
  animation:fade .45s ease;overflow:hidden}
.sfit{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;transform-origin:top left}
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px;max-width:1040px}
.cover-kicker{font:700 13px/1 var(--sans);letter-spacing:3px;text-transform:uppercase;color:var(--exec);margin-bottom:20px}
.cover-title{font-size:74px;line-height:1.02;font-weight:700;letter-spacing:-1.5px;
  background:linear-gradient(120deg,var(--ink) 30%,var(--exec));-webkit-background-clip:text;background-clip:text;color:transparent}
.cover-rule{width:118px;height:5px;border-radius:3px;margin:26px 0 18px;background:linear-gradient(90deg,var(--exec),var(--tech))}
.cover-sub{font-size:22px;font-weight:600;color:var(--ink2)}
.cover-meta{display:flex;gap:56px;margin-top:42px;flex-wrap:wrap}
.cover-meta .cm-l{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.cover-meta .cm-v{font-size:18px;font-weight:600;color:var(--ink)}
.cover-days{margin-top:38px;font-size:13px;letter-spacing:1px;color:var(--ink3);font-family:var(--mono)}
.slide.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}

/* ---- header ---- */
.shead{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-shrink:0}
.badge{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
  font-weight:700;font-size:19px;flex-shrink:0}
.badge.exec{background:rgba(74,144,226,.15);color:var(--exec);border:1px solid rgba(74,144,226,.4)}
.badge.tech{background:rgba(46,204,113,.14);color:var(--tech);border:1px solid rgba(46,204,113,.4)}
.badge.mix{background:rgba(163,113,247,.14);color:var(--purple);border:1px solid rgba(163,113,247,.4)}
.shead h2{font-size:26px;font-weight:600;letter-spacing:-.3px}
.shead .kick{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink3);font-weight:600}

/* ---- 2-col ---- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:14px}
.col-label{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.col-label.e{color:var(--exec)} .col-label.t{color:var(--tech)}
.full{grid-column:1/-1}

/* ---- content atoms ---- */
h3.blk{font-size:16px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:8px}
p.body{font-size:14.5px;line-height:1.6;color:var(--ink2)}
ul.list{list-style:none;display:flex;flex-direction:column;gap:7px}
ul.list li{font-size:14px;line-height:1.5;color:var(--ink2);padding-left:22px;position:relative}
ul.list li::before{content:'▸';position:absolute;left:0;color:var(--exec);font-weight:700}
ul.list.t li::before{content:'▸';color:var(--tech)}
ul.list.check li::before{content:'✓';color:var(--aqua)}
ul.list.cross li::before{content:'✕';color:var(--danger)}
.hl{color:var(--ink);font-weight:600}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat .n{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat .l{font-size:12.5px;color:var(--ink3);margin-top:5px}
.stat.g .n{color:var(--tech)} .stat.b .n{color:var(--exec)}
.stat.o .n{color:var(--gold)} .stat.a .n{color:var(--aqua)}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card2{background:var(--panel2)}

/* ---- code / terminal ---- */
pre.code{background:#0a0e14;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  font-family:var(--mono);font-size:12.5px;line-height:1.5;color:#c9d6e5;white-space:pre-wrap;word-break:break-word;overflow-x:hidden}
.code .cm{color:#6b7c91} .code .kw{color:#a371f7} .code .st{color:#7ee787}
.code .nm{color:#f5a623} .code .fn{color:#4a90e2}

/* ---- source / verify chip ---- */
.src{display:inline-flex;align-items:center;gap:6px;font-size:11px;
  background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.35);color:var(--gold);
  padding:3px 9px;border-radius:20px;margin-top:6px;cursor:help}
.src::before{content:'⚠';font-size:11px}
.fact{border-left:3px solid var(--exec);padding:8px 0 8px 14px;margin:2px 0}
.fact .ft{font-size:14.5px;color:var(--ink);line-height:1.5}

/* ---- footer nav ---- */
#foot{position:fixed;left:0;right:0;bottom:0;z-index:60;height:56px;border-top:1px solid var(--line);background:var(--panel);transform:translateY(105%);transition:transform .28s ease;
  display:flex;align-items:center;padding:0 22px;gap:16px}
#foot:hover,#foot.show{transform:none}
#progress{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
#bar{height:100%;width:5%;background:linear-gradient(90deg,var(--exec),var(--tech));
  border-radius:3px;transition:width .35s}
.nbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  width:38px;height:38px;border-radius:9px;font-size:16px;cursor:pointer;transition:.15s}
.nbtn:hover{border-color:var(--exec);color:var(--exec)}
.nbtn:disabled{opacity:.3;cursor:default}
#counter{font-size:13px;color:var(--ink2);min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
#counter b{color:var(--ink)}
.brand{font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.5px}
#tocBtn{background:none;border:1px solid var(--line);color:var(--ink2);padding:7px 12px;
  border-radius:8px;font-size:12px;cursor:pointer}
#tocBtn:hover{border-color:var(--exec);color:var(--exec)}

/* ---- TOC overlay ---- */
#toc{position:absolute;inset:0;background:rgba(6,9,14,.96);z-index:40;display:none;
  padding:44px 60px;overflow-y:auto}
#toc.open{display:block}
#toc h2{font-size:22px;margin-bottom:22px;color:var(--ink)}
.toc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.toc-item{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  cursor:pointer;transition:.15s;display:flex;gap:10px;align-items:flex-start}
.toc-item:hover{border-color:var(--exec);transform:translateY(-2px)}
.toc-item .tn{font-size:11px;font-weight:700;color:var(--ink3);flex-shrink:0}
.toc-item .tt{font-size:12.5px;line-height:1.35;color:var(--ink2)}
.toc-close{position:absolute;top:22px;right:26px;background:none;border:none;color:var(--ink2);
  font-size:26px;cursor:pointer}

/* ---- interactive widgets ---- */
.widget{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.wlabel{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--tech);
  font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.wlabel::before{content:'●';font-size:9px;color:var(--tech)}

/* slider */
input[type=range]{width:100%;accent-color:var(--exec);height:6px;cursor:pointer;margin:8px 0}
.slider-out{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px}
.slider-out .big{font-size:22px;font-weight:700;color:var(--exec)}

/* buttons */
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:9px 15px;
  border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--sans);transition:.15s}
.btn:hover{border-color:var(--tech);color:var(--tech)}
.btn.run{background:rgba(46,204,113,.12);border-color:rgba(46,204,113,.4);color:var(--tech)}
.btn.on{background:var(--exec);border-color:var(--exec);color:#fff}

/* quiz */
.quiz-opt{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px 15px;
  margin-bottom:9px;cursor:pointer;transition:.15s;font-size:14px;display:flex;gap:11px;align-items:center}
.quiz-opt:hover{border-color:var(--exec)}
.quiz-opt .k{width:24px;height:24px;border-radius:6px;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.quiz-opt.correct{border-color:var(--tech);background:rgba(46,204,113,.12)}
.quiz-opt.correct .k{background:var(--tech);color:#04150b;border-color:var(--tech)}
.quiz-opt.wrong{border-color:var(--danger);background:rgba(229,72,77,.1)}
.quiz-opt.wrong .k{background:var(--danger);color:#fff;border-color:var(--danger)}
.quiz-fb{font-size:13px;line-height:1.55;padding:11px 14px;border-radius:8px;margin-top:6px;display:none}
.quiz-fb.show{display:block}
.quiz-fb.ok{background:rgba(46,204,113,.1);color:#7ee0b0;border:1px solid rgba(46,204,113,.3)}
.quiz-fb.no{background:rgba(229,72,77,.1);color:#f0a0a2;border:1px solid rgba(229,72,77,.3)}

/* terminal */
.term{background:#05080d;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-family:var(--mono)}
.term-bar{background:var(--panel2);padding:8px 13px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
.term-dot{width:11px;height:11px;border-radius:50%}
.term-title{font-size:12px;color:var(--ink3);margin-left:8px}
.term-body{padding:14px 16px;font-size:12.5px;line-height:1.7;min-height:150px;max-height:230px;overflow-y:auto}
.term-body .pr{color:var(--tech)} .term-body .out{color:#c9d6e5}
.term-body .dim{color:var(--ink3)} .term-body .warn{color:var(--gold)}
.term-cmds{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}

/* pipeline / diagram */
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.node{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 14px;
  text-align:center;min-width:92px}
.node .t{font-size:13px;font-weight:600;color:var(--ink)}
.node .s{font-size:11px;color:var(--ink3);margin-top:2px}
.node.b{border-color:rgba(74,144,226,.5)} .node.g{border-color:rgba(46,204,113,.5)}
.node.o{border-color:rgba(245,166,35,.5)} .node.a{border-color:rgba(80,227,194,.5)}
.arrow{color:var(--ink3);font-size:18px}

/* medallion */
.medal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.layer{border-radius:10px;padding:13px;text-align:center;border:1px solid}
.layer .ln{font-size:14px;font-weight:700}
.layer .ld{font-size:11.5px;color:var(--ink2);margin-top:5px;line-height:1.4}
.layer.raw{background:rgba(107,124,145,.1);border-color:var(--ink3)}
.layer.raw .ln{color:var(--ink2)}
.layer.brz{background:rgba(205,127,80,.1);border-color:#cd7f50}
.layer.brz .ln{color:#e0955f}
.layer.slv{background:rgba(158,178,196,.12);border-color:#9eb2c4}
.layer.slv .ln{color:#b8c8d8}
.layer.gld{background:rgba(245,166,35,.12);border-color:var(--gold)}
.layer.gld .ln{color:var(--gold)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;font-weight:600;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}

table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th{text-align:left;padding:9px 11px;background:var(--panel2);color:var(--ink);
  font-weight:600;border:1px solid var(--line)}
table.cmp td{padding:8px 11px;border:1px solid var(--line);color:var(--ink2);vertical-align:top}
table.cmp td:first-child{color:var(--ink3);font-size:12px}

.note{font-size:12px;color:var(--ink3);font-style:italic;margin-top:6px}

/* ---- case study ---- */
.case-hero{border-radius:12px;padding:16px 18px;border:1px solid var(--line);
  background:linear-gradient(135deg,rgba(74,144,226,.08),rgba(46,204,113,.05))}
.case-hero.fail{background:linear-gradient(135deg,rgba(229,72,77,.1),rgba(245,166,35,.05));border-color:rgba(229,72,77,.35)}
.case-hero.win{background:linear-gradient(135deg,rgba(46,204,113,.1),rgba(80,227,194,.05));border-color:rgba(46,204,113,.35)}
.case-hero.fraud{background:linear-gradient(135deg,rgba(245,166,35,.1),rgba(229,72,77,.06));border-color:rgba(245,166,35,.35)}
.case-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;margin-bottom:8px}
.case-tag.fail{background:rgba(229,72,77,.18);color:#f0a0a2}
.case-tag.win{background:rgba(46,204,113,.18);color:#7ee0b0}
.case-tag.fraud{background:rgba(245,166,35,.18);color:var(--gold)}
.case-hero .ch-t{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.3px}
.case-hero .ch-s{font-size:13px;color:var(--ink2);margin-top:3px}
.discuss{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--purple);
  border-radius:0 10px 10px 0;padding:12px 15px}
.discuss .dq{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--purple);font-weight:700;margin-bottom:8px}
.discuss ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.discuss li{font-size:13.5px;line-height:1.5;color:var(--ink2);padding-left:20px;position:relative}
.discuss li::before{content:'?';position:absolute;left:0;color:var(--purple);font-weight:700}
.upd{display:inline-flex;align-items:center;gap:6px;font-size:11px;
  background:rgba(163,113,247,.12);border:1px dashed rgba(163,113,247,.5);color:#c4a5f7;
  padding:4px 10px;border-radius:7px;margin-top:8px}
.upd::before{content:'✎';font-size:11px}
.lesson{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:11px 13px}
.lesson .li-ico{font-size:18px;flex-shrink:0}
.lesson .li-tx{font-size:13px;line-height:1.5;color:var(--ink2)}
.lesson .li-tx b{color:var(--ink)}

/* ---- tool cards ---- */
.tool{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:13px 15px;text-decoration:none;transition:.15s}
.tool:hover{border-color:var(--exec);transform:translateY(-2px);background:var(--panel2)}
.tool .ti-ico{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.tool .ti-body{flex:1;min-width:0}
.tool .ti-name{font-size:15px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
.tool .ti-name .ext{font-size:11px;color:var(--ink3)}
.tool:hover .ti-name{color:var(--exec)}
.tool .ti-desc{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
.tool .ti-url{font-size:11px;color:var(--exec);font-family:var(--mono);margin-top:5px;word-break:break-all}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ico-hdfs{background:rgba(74,144,226,.15);color:var(--exec)}
.ico-sqoop{background:rgba(245,166,35,.15);color:var(--gold)}
.ico-hive{background:rgba(46,204,113,.15);color:var(--tech)}
.ico-spark{background:rgba(229,72,77,.15);color:var(--danger)}
.ico-bi{background:rgba(163,113,247,.15);color:var(--purple)}
.ico-aqua{background:rgba(80,227,194,.15);color:var(--aqua)}
a.srclink{color:var(--gold);text-decoration:none;border-bottom:1px dotted rgba(245,166,35,.5)}
a.srclink:hover{color:#ffc95c;border-bottom-style:solid}

/* ---- install tutorial ---- */
.winnote{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:rgba(74,144,226,.1);
  border:1px solid rgba(74,144,226,.35);color:var(--exec);padding:5px 11px;border-radius:7px;margin-top:8px}
.winnote::before{content:'🪟';font-size:12px}
.oswrap .os-btn{opacity:.6}
.oswrap .os-btn.on{opacity:1;background:var(--exec);border-color:var(--exec);color:#fff}
.os-pane{display:none}
.os-pane.active{display:block}
.step-num{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--panel2);
  border:1px solid var(--line);color:var(--ink2);font-size:11px;font-weight:700;align-items:center;
  justify-content:center;flex-shrink:0;margin-top:1px}
.step{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px}
.step .st-tx{font-size:13px;color:var(--ink2);line-height:1.5}
.verify-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.verify-row:last-child{border-bottom:none}
.verify-row code{font-family:var(--mono);color:var(--tech);font-size:12px}
.verify-row .vok{color:var(--ink3);font-size:11.5px}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;
  font-family:var(--mono);font-size:12px;color:var(--ink2)}

/* ---- dashboard mockup ---- */
.dash-mock{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dash-tile{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px;
  min-height:64px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.dash-tile .dt-n{font-size:19px;font-weight:800;color:var(--exec)}
.dash-tile .dt-l{font-size:10.5px;color:var(--ink3);margin-top:3px}
.dash-empty{border:1px dashed var(--line);border-radius:9px;padding:18px;text-align:center;color:var(--ink3);font-size:12px}

/* ---- feature bars ---- */
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;cursor:pointer}
.bar-row .br-label{width:118px;font-size:12.5px;color:var(--ink2);flex-shrink:0}
.bar-track{flex:1;height:18px;background:var(--panel2);border-radius:5px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--exec),var(--tech));border-radius:5px;
  transition:width .5s ease;width:0}
.bar-val{font-size:11px;color:var(--ink3);width:32px;text-align:right;flex-shrink:0}
.bar-row.on .br-label{color:var(--ink)}

/* ---- criteria / timeline reuse node styles ---- */
.ico-aws{background:rgba(245,166,35,.15);color:var(--gold)}
.ico-gcp{background:rgba(74,144,226,.15);color:var(--exec)}
.ico-azure{background:rgba(80,227,194,.15);color:var(--aqua)}
.crit-card{cursor:pointer;transition:.15s}
.crit-card.on{border-color:var(--exec) !important;background:var(--panel2)}

/* ---- SVG visuals (offline) ---- */
.viz{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.viz.plain{background:none;border:none;padding:0}
.viz svg{width:100%;height:auto;display:block;overflow:visible}
.viz.compact svg{max-width:168px;margin:0 auto}
.viz figcaption{font-size:11px;color:var(--ink3);text-align:center;line-height:1.4}
.viz .vtitle{font-size:11px;text-transform:uppercase;letter-spacing:1.1px;font-weight:700;color:var(--ink3)}

@keyframes vgrow{to{transform:scaleY(1)}}
.viz .ring{stroke-dasharray:var(--circ);stroke-dashoffset:var(--circ)}
.slide.active .viz .ring{animation:vring .7s ease forwards}
@keyframes vring{to{stroke-dashoffset:var(--off)}}
@media (prefers-reduced-motion:reduce){
  .viz .grow{transform:none;animation:none}
  .viz .ring{stroke-dashoffset:var(--off);animation:none}}
.cite{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:1.35;

<script>
const SRC = (txt) => `<span class="src" title="Número plausível para ensino — confirme na fonte antes de apresentar">${txt}</span>`;
function CITE(txt,url){return url
  ? `<a class="cite" href="${url}" target="_blank" rel="noopener" title="Fonte verificada">${txt} ↗</a>`
  : `<span class="cite" title="Fonte verificada">${txt}</span>`;}

/* ===== MOTOR VISUAL — SVG inline, offline, tema escuro ===== */
var VC={exec:'#4a90e2',tech:'#2ecc71',gold:'#f5a623',aqua:'#50e3c2',purple:'#a371f7',
  danger:'#e5484d',ink:'#e6edf3',ink2:'#9fb0c3',ink3:'#6b7c91',line:'#2b3444',panel:'#161b22',panel2:'#1c2230'};
var ICON={
  db:'<ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/><path d="M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/>',
  cluster:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  spark:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  transfer:'<path d="M4 8h13m0 0-3.5-3.5M17 8l-3.5 3.5"/><path d="M20 16H7m0 0 3.5-3.5M7 16l3.5 3.5"/>',
  hive:'<path d="M8 3h8l4 7-4 7H8l-4-7z"/><path d="M9.5 8.5h5l2.2 3.5-2.2 3.5h-5L7.3 12z" opacity=".45"/>',
  chart:'<path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="12" width="3" height="5" rx=".6"/><rect x="12" y="8" width="3" height="9" rx=".6"/><rect x="17" y="5" width="3" height="12" rx=".6"/>',
  gauge:'<path d="M4 15a8 8 0 0 1 16 0"/><path d="M12 15l4-4"/><circle cx="12" cy="15" r="1.3" fill="currentColor" stroke="none"/>',
  brain:'<path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-1 5.8V15a3 3 0 0 0 4 2.8M15 3a3 3 0 0 1 3 3 3 3 0 0 1 1 5.8V15a3 3 0 0 1-4 2.8M12 4v16"/>',
  cloud:'<path d="M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.3A3.5 3.5 0 0 1 17 18z"/>',
  layers:'<path d="M12 3 3 8l9 5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 16l9 5 9-5"/>',
  dash:'<rect x="3" y="3" width="8" height="9" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/>',
  python:'<path d="M12 3c-3 0-4 1.5-4 3.5V9h4.5M12 3c2.2 0 3.5.7 3.5 2.5V11c0 2-1.3 3-3.5 3H9c-2.2 0-3.5 1-3.5 3v2C5.5 20.5 7 21 9 21"/>'
};
function icon(n,c,s){c=c||'currentColor';s=s||22;
  return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]||''}</svg>`;}
function iconRow(items){return `<div class="iconrow">${items.map(t=>`<span class="ichip">${icon(t.i,t.color||VC.ink2)}<span class="il">${t.label}</span></span>`).join('')}</div>`;}
function barsV(data,opt){opt=opt||{};var W=opt.w||360,H=opt.h||156,pl=30,pb=24,pt=22;
  var max=opt.max||Math.max.apply(null,data.map(function(d){return d.value;}));
  var iw=W-pl-8,gap=iw/data.length,bw=Math.min(opt.bw||46,gap*0.6);
  var g='<line x1="'+pl+'" y1="'+(H-pb)+'" x2="'+W+'" y2="'+(H-pb)+'" stroke="'+VC.line+'"/>';
  data.forEach(function(d,i){var h=Math.max(2,(d.value/max)*(H-pb-pt));
    var x=pl+i*gap+(gap-bw)/2,y=H-pb-h,c=d.color||VC.exec;
    g+='<rect class="grow" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="4" fill="'+c+'" style="animation-delay:'+(i*0.08)+'s"/>';
    g+='<text x="'+(x+bw/2)+'" y="'+(y-6)+'" fill="'+VC.ink+'" font-size="12.5" font-weight="700" text-anchor="middle">'+(d.top!=null?d.top:d.value)+'</text>';
    g+='<text x="'+(x+bw/2)+'" y="'+(H-pb+15)+'" fill="'+VC.ink3+'" font-size="11" text-anchor="middle">'+d.label+'</text>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(opt.aria||'gráfico de barras')+'">'+g+'</svg>';}
function donut(frac,label,sub,color){color=color||VC.exec;
  var r=46,circ=2*Math.PI*r,off=circ*(1-Math.max(0,Math.min(1,frac)));
  return '<svg viewBox="0 0 120 120" role="img" aria-label="'+(label||'')+' '+(sub||'')+'">'
    +'<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+VC.line+'" stroke-width="11"/>'
    +'<circle class="ring" cx="60" cy="60" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="11" stroke-linecap="round" transform="rotate(-90 60 60)" style="--circ:'+circ.toFixed(1)+'px;--off:'+off.toFixed(1)+'px"/>'
    +'<text x="60" y="58" fill="'+VC.ink+'" font-size="24" font-weight="800" text-anchor="middle">'+label+'</text>'
    +'<text x="60" y="76" fill="'+VC.ink3+'" font-size="10.5" text-anchor="middle">'+(sub||'')+'</text></svg>';}

/* ---- pausas de laboratório ---- */
function labBreak(c){return `<div class="labstop">
  <div class="ls-badge">Hora do lab · pare a apresentação</div>

  <div class="ls-meta"><span>⏱ ${c.time}</span><span>📄 <code>${c.file}</code></span><span>🔀 ${c.rotas}</span>${c.prereq?`<span>🔗 ${c.prereq}</span>`:''}</div>

    <div class="col"><div class="col-label t">Passos principais</div>

      <div class="ls-cta"><b>Abram o arquivo do lab e sigam juntos.</b> Retomo a apresentação quando todos concluírem o checklist do lab.</div></div>
  </div></div>`;}
function labBreakSet(c){return `<div class="labstop">
  <div class="ls-badge">Hora dos labs · pare a apresentação</div>
  <h2 class="ls-title">${c.heading}</h2>
  <div class="ls-meta"><span>⏱ ${c.time}</span><span>🔀 ${c.rotas}</span>${c.prereq?`<span>🔗 ${c.prereq}</span>`:''}</div>
  <div class="lab-grid" style="flex:1;align-content:start">
    ${c.labs.map(function(l){return '<div class="lab-card"><div class="lc-top"><span class="lc-n">Lab '+l.n+'</span><code>'+l.file+'</code></div><div class="lc-title">'+l.title+'</div><div class="lc-goal">'+l.goal+'</div></div>';}).join('')}
  </div>
  <div class="ls-cta"><b>Façam os labs na ordem, seguindo o roteiro de cada arquivo.</b> Retomo a apresentação quando a turma concluir o bloco.</div></div>`;}

/* =========================================================================

   ========================================================================= */
let cur=0;
const wrap=document.getElementById('slideWrap');
const tocGrid=document.getElementById('tocGrid');

function badgeLabel(b){return b==='exec'?'EXEC':b==='tech'?'TECH':b==='lab'?'LAB':'MIX';}

function buildSlides(){
  slides.forEach((s,i)=>{
    const el=document.createElement('section');
    el.className='slide'; el.id='slide'+i;
    el.innerHTML=`<div class="sfit">${s.cover?'':`
      <div class="shead">
        <div class="badge ${s.badge}">${String(i+1).padStart(2,'0')}</div>
        <div><div class="kick">${s.kick} · ${badgeLabel(s.badge)}</div><h2>${s.title}</h2></div>
      </div>`}${s.html}</div>`;
    wrap.appendChild(el);

    const t=document.createElement('div');
    t.className='toc-item';
    t.innerHTML=`<span class="tn">${String(i+1).padStart(2,'0')}</span><span class="tt">${s.title}</span>`;
    t.onclick=()=>{show(i);toggleToc();};
    tocGrid.appendChild(t);
  });
}

function show(i){
  document.getElementById('slide'+cur)?.classList.remove('active');
  cur=Math.max(0,Math.min(slides.length-1,i));
  document.getElementById('slide'+cur).classList.add('active');
  document.getElementById('bar').style.width=((cur+1)/slides.length*100)+'%';
  document.getElementById('counter').innerHTML=`<b>${cur+1}</b> / ${slides.length}`;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===slides.length-1;
  wireWidgets();
}
function go(d){show(cur+d);}
function toggleToc(){document.getElementById('toc').classList.toggle('open');}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(1);
  if(e.key==='ArrowLeft')go(-1);
  if(e.key==='Escape')document.getElementById('toc').classList.remove('open');
});

wrap.addEventListener('click',e=>{
  const b=e.target.closest('.os-btn');
  if(!b)return;
  const group=b.closest('.oswrap')||b.parentElement;
  group.querySelectorAll('.os-btn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  const pane=group.parentElement.querySelectorAll('.os-pane');
  pane.forEach(p=>p.classList.toggle('active',p.dataset.os===b.dataset.os));
});

<!-- copy-to-clipboard nos blocos de código -->
<style>
.code-wrap{position:relative}
.copy-btn{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:5px;
  padding:4px 8px;font:600 11px/1 var(--mono,monospace);color:#c9d6e5;
  background:rgba(255,255,255,.06);border:1px solid var(--line,#2a3441);border-radius:7px;
  cursor:pointer;opacity:0;transition:opacity .15s,background .15s,color .15s;z-index:2}
.code-wrap:hover .copy-btn{opacity:1}
.copy-btn:hover{background:rgba(255,255,255,.12)}
.copy-btn.ok{color:#7ee787;border-color:#2ea04366}
</style>
<script>
(function(){
  function label(b,txt,cls){b.querySelector('span').textContent=txt;b.className='copy-btn'+(cls?' '+cls:'');}
  function addBtns(root){
    (root||document).querySelectorAll('pre.code').forEach(function(pre){
      if(pre.parentElement.classList.contains('code-wrap'))return;
      var wrap=document.createElement('div');wrap.className='code-wrap';
      pre.parentNode.insertBefore(wrap,pre);wrap.appendChild(pre);
      var b=document.createElement('button');b.className='copy-btn';b.type='button';
      b.innerHTML='<span>📋 copiar</span>';
      b.addEventListener('click',function(){
        var t=pre.innerText.replace(/\s+$/,'');
        navigator.clipboard.writeText(t).then(function(){
          label(b,'✓ copiado','ok');setTimeout(function(){label(b,'📋 copiar');},1400);
        }).catch(function(){label(b,'erro');setTimeout(function(){label(b,'📋 copiar');},1400);});
      });
      wrap.appendChild(b);
    });
  }
  addBtns();
  new MutationObserver(function(m){m.forEach(function(x){if(x.addedNodes.length)addBtns();});})
    .observe(document.body,{childList:true,subtree:true});
})();
</script>

<!-- auto-fit de conteúdo + barra inferior com auto-hide -->
<script>
function fitSlide(){
  var s=document.querySelector('.slide.active'); if(!s) return;
  var f=s.querySelector('.sfit'); if(!f) return;
  f.style.transform='none'; f.style.width='';
  var availH=f.clientHeight, availW=f.clientWidth;
  var needH=f.scrollHeight, needW=f.scrollWidth, sc=1;
  if(needH>availH+1) sc=Math.min(sc, availH/needH);
  if(needW>availW+1) sc=Math.min(sc, availW/needW);
  if(sc<1){ sc=Math.max(0.5, sc);
    f.style.width=(100/sc)+'%'; f.style.transform='scale('+sc+')'; }
}
(function(){
  var wrap=document.getElementById('slideWrap');
  if(wrap){
    new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        var t=muts[i].target;
        if(t.classList && t.classList.contains('active')){ requestAnimationFrame(fitSlide); break; }
      }
    }).observe(wrap,{attributes:true,attributeFilter:['class'],subtree:true});
    wrap.addEventListener('click',function(){ requestAnimationFrame(fitSlide); });
  }
  window.addEventListener('resize',function(){ requestAnimationFrame(fitSlide); });
  window.addEventListener('load',function(){ requestAnimationFrame(fitSlide); });
  requestAnimationFrame(fitSlide);
  var foot=document.getElementById('foot');
  if(foot) document.addEventListener('mousemove',function(e){
    foot.classList.toggle('show', e.clientY > window.innerHeight-72);
  });
})();
</script>
