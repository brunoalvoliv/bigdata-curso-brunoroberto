<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introdução Big Data - MBA/UFC — DIA 1</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2b3444;
  --ink:#e6edf3; --ink2:#9fb0c3; --ink3:#6b7c91;
  --exec:#4a90e2; --tech:#2ecc71; --gold:#f5a623; --danger:#e5484d;
  --aqua:#50e3c2; --purple:#a371f7; --dot:rgba(255,255,255,.028);
  --mono:'SF Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
  --sans:'Segoe UI',system-ui,-apple-system,sans-serif;
}
/* ---------- TEMA CLARO ---------- */
body.light{
  --bg:#f7f9fb; --panel:#ffffff; --panel2:#eaeef3; --line:#c4ccd6;
  --ink:#0b0e12; --ink2:#3a424c; --ink3:#616a75;
  --dot:rgba(12,24,44,.055);
}
#themeBtn{background:none;border:1px solid var(--line);color:var(--ink2);
  padding:7px 11px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1}
#themeBtn:hover{background:var(--panel2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:22px 22px;background-position:-1px -1px;color:var(--ink);font-family:var(--sans);overflow:hidden}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}

/* ---- stage ---- */
#stage{height:100vh;display:flex;flex-direction:column}
#slideWrap{flex:1;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;padding:48px 60px 30px;display:none;flex-direction:column;
  animation:fade .45s ease;overflow:hidden}
.sfit{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;transform-origin:top left}
.cover{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px;max-width:1040px}
.cover-kicker{font:700 13px/1 var(--sans);letter-spacing:3px;text-transform:uppercase;color:var(--exec);margin-bottom:20px}
.cover-title{font-size:74px;line-height:1.02;font-weight:700;letter-spacing:-1.5px;
  background:linear-gradient(120deg,var(--ink) 30%,var(--exec));-webkit-background-clip:text;background-clip:text;color:transparent}
.cover-rule{width:118px;height:5px;border-radius:3px;margin:26px 0 18px;background:linear-gradient(90deg,var(--exec),var(--tech))}
.cover-sub{font-size:22px;font-weight:600;color:var(--ink2)}
.cover-meta{display:flex;gap:56px;margin-top:42px;flex-wrap:wrap}
.cover-meta .cm-l{display:block;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.cover-meta .cm-v{font-size:18px;font-weight:600;color:var(--ink)}
.cover-days{margin-top:38px;font-size:13px;letter-spacing:1px;color:var(--ink3);font-family:var(--mono)}
.slide.active{display:flex}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}

/* ---- header ---- */
.shead{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-shrink:0}
.badge{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
  font-weight:700;font-size:19px;flex-shrink:0}
.badge.exec{background:rgba(74,144,226,.15);color:var(--exec);border:1px solid rgba(74,144,226,.4)}
.badge.tech{background:rgba(46,204,113,.14);color:var(--tech);border:1px solid rgba(46,204,113,.4)}
.badge.mix{background:rgba(163,113,247,.14);color:var(--purple);border:1px solid rgba(163,113,247,.4)}
.shead h2{font-size:26px;font-weight:600;letter-spacing:-.3px}
.shead .kick{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--ink3);font-weight:600}

/* ---- 2-col ---- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;flex:1;min-height:0}
.col{display:flex;flex-direction:column;gap:14px}
.col-label{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;font-weight:700;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.col-label.e{color:var(--exec)} .col-label.t{color:var(--tech)}
.full{grid-column:1/-1}

/* ---- content atoms ---- */
h3.blk{font-size:16px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:8px}
p.body{font-size:14.5px;line-height:1.6;color:var(--ink2)}
ul.list{list-style:none;display:flex;flex-direction:column;gap:7px}
ul.list li{font-size:14px;line-height:1.5;color:var(--ink2);padding-left:22px;position:relative}
ul.list li::before{content:'▸';position:absolute;left:0;color:var(--exec);font-weight:700}
ul.list.t li::before{content:'▸';color:var(--tech)}
ul.list.check li::before{content:'✓';color:var(--aqua)}
ul.list.cross li::before{content:'✕';color:var(--danger)}
.hl{color:var(--ink);font-weight:600}

.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat .n{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}
.stat .l{font-size:12.5px;color:var(--ink3);margin-top:5px}
.stat.g .n{color:var(--tech)} .stat.b .n{color:var(--exec)}
.stat.o .n{color:var(--gold)} .stat.a .n{color:var(--aqua)}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.card2{background:var(--panel2)}

/* ---- code / terminal ---- */
pre.code{background:#0a0e14;border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  font-family:var(--mono);font-size:12.5px;line-height:1.5;color:#c9d6e5;white-space:pre-wrap;word-break:break-word;overflow-x:hidden}
.code .cm{color:#6b7c91} .code .kw{color:#a371f7} .code .st{color:#7ee787}
.code .nm{color:#f5a623} .code .fn{color:#4a90e2}

/* ---- source / verify chip ---- */
.src{display:inline-flex;align-items:center;gap:6px;font-size:11px;
  background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.35);color:var(--gold);
  padding:3px 9px;border-radius:20px;margin-top:6px;cursor:help}
.src::before{content:'⚠';font-size:11px}
.fact{border-left:3px solid var(--exec);padding:8px 0 8px 14px;margin:2px 0}
.fact .ft{font-size:14.5px;color:var(--ink);line-height:1.5}

/* ---- footer nav ---- */
#foot{position:fixed;left:0;right:0;bottom:0;z-index:60;height:56px;border-top:1px solid var(--line);background:var(--panel);transform:translateY(105%);transition:transform .28s ease;
  display:flex;align-items:center;padding:0 22px;gap:16px}
#foot:hover,#foot.show{transform:none}
#progress{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
#bar{height:100%;width:5%;background:linear-gradient(90deg,var(--exec),var(--tech));
  border-radius:3px;transition:width .35s}
.nbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  width:38px;height:38px;border-radius:9px;font-size:16px;cursor:pointer;transition:.15s}
.nbtn:hover{border-color:var(--exec);color:var(--exec)}
.nbtn:disabled{opacity:.3;cursor:default}
#counter{font-size:13px;color:var(--ink2);min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
#counter b{color:var(--ink)}
.brand{font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.5px}
#tocBtn{background:none;border:1px solid var(--line);color:var(--ink2);padding:7px 12px;
  border-radius:8px;font-size:12px;cursor:pointer}
#tocBtn:hover{border-color:var(--exec);color:var(--exec)}

/* ---- TOC overlay ---- */
#toc{position:absolute;inset:0;background:rgba(6,9,14,.96);z-index:40;display:none;
  padding:44px 60px;overflow-y:auto}
#toc.open{display:block}
#toc h2{font-size:22px;margin-bottom:22px;color:var(--ink)}
.toc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.toc-item{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  cursor:pointer;transition:.15s;display:flex;gap:10px;align-items:flex-start}
.toc-item:hover{border-color:var(--exec);transform:translateY(-2px)}
.toc-item .tn{font-size:11px;font-weight:700;color:var(--ink3);flex-shrink:0}
.toc-item .tt{font-size:12.5px;line-height:1.35;color:var(--ink2)}
.toc-close{position:absolute;top:22px;right:26px;background:none;border:none;color:var(--ink2);
  font-size:26px;cursor:pointer}

/* ---- interactive widgets ---- */
.widget{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.wlabel{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--tech);
  font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.wlabel::before{content:'●';font-size:9px;color:var(--tech)}

/* slider */
input[type=range]{width:100%;accent-color:var(--exec);height:6px;cursor:pointer;margin:8px 0}
.slider-out{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px}
.slider-out .big{font-size:22px;font-weight:700;color:var(--exec)}

/* buttons */
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:9px 15px;
  border-radius:8px;font-size:13px;cursor:pointer;font-family:var(--sans);transition:.15s}
.btn:hover{border-color:var(--tech);color:var(--tech)}
.btn.run{background:rgba(46,204,113,.12);border-color:rgba(46,204,113,.4);color:var(--tech)}
.btn.on{background:var(--exec);border-color:var(--exec);color:#fff}

/* quiz */
.quiz-opt{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px 15px;
  margin-bottom:9px;cursor:pointer;transition:.15s;font-size:14px;display:flex;gap:11px;align-items:center}
.quiz-opt:hover{border-color:var(--exec)}
.quiz-opt .k{width:24px;height:24px;border-radius:6px;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;font-weight:700;flex-shrink:0}
.quiz-opt.correct{border-color:var(--tech);background:rgba(46,204,113,.12)}
.quiz-opt.correct .k{background:var(--tech);color:#04150b;border-color:var(--tech)}
.quiz-opt.wrong{border-color:var(--danger);background:rgba(229,72,77,.1)}
.quiz-opt.wrong .k{background:var(--danger);color:#fff;border-color:var(--danger)}
.quiz-fb{font-size:13px;line-height:1.55;padding:11px 14px;border-radius:8px;margin-top:6px;display:none}
.quiz-fb.show{display:block}
.quiz-fb.ok{background:rgba(46,204,113,.1);color:#7ee0b0;border:1px solid rgba(46,204,113,.3)}
.quiz-fb.no{background:rgba(229,72,77,.1);color:#f0a0a2;border:1px solid rgba(229,72,77,.3)}

/* terminal */
.term{background:#05080d;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-family:var(--mono)}
.term-bar{background:var(--panel2);padding:8px 13px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--line)}
.term-dot{width:11px;height:11px;border-radius:50%}
.term-title{font-size:12px;color:var(--ink3);margin-left:8px}
.term-body{padding:14px 16px;font-size:12.5px;line-height:1.7;min-height:150px;max-height:230px;overflow-y:auto}
.term-body .pr{color:var(--tech)} .term-body .out{color:#c9d6e5}
.term-body .dim{color:var(--ink3)} .term-body .warn{color:var(--gold)}
.term-cmds{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}

/* pipeline / diagram */
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.node{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 14px;
  text-align:center;min-width:92px}
.node .t{font-size:13px;font-weight:600;color:var(--ink)}
.node .s{font-size:11px;color:var(--ink3);margin-top:2px}
.node.b{border-color:rgba(74,144,226,.5)} .node.g{border-color:rgba(46,204,113,.5)}
.node.o{border-color:rgba(245,166,35,.5)} .node.a{border-color:rgba(80,227,194,.5)}
.arrow{color:var(--ink3);font-size:18px}

/* medallion */
.medal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.layer{border-radius:10px;padding:13px;text-align:center;border:1px solid}
.layer .ln{font-size:14px;font-weight:700}
.layer .ld{font-size:11.5px;color:var(--ink2);margin-top:5px;line-height:1.4}
.layer.raw{background:rgba(107,124,145,.1);border-color:var(--ink3)}
.layer.raw .ln{color:var(--ink2)}
.layer.brz{background:rgba(205,127,80,.1);border-color:#cd7f50}
.layer.brz .ln{color:#e0955f}
.layer.slv{background:rgba(158,178,196,.12);border-color:#9eb2c4}
.layer.slv .ln{color:#b8c8d8}
.layer.gld{background:rgba(245,166,35,.12);border-color:var(--gold)}
.layer.gld .ln{color:var(--gold)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;font-weight:600;
  background:var(--panel2);border:1px solid var(--line);color:var(--ink2)}

table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th{text-align:left;padding:9px 11px;background:var(--panel2);color:var(--ink);
  font-weight:600;border:1px solid var(--line)}
table.cmp td{padding:8px 11px;border:1px solid var(--line);color:var(--ink2);vertical-align:top}
table.cmp td:first-child{color:var(--ink3);font-size:12px}

.note{font-size:12px;color:var(--ink3);font-style:italic;margin-top:6px}

/* ---- case study ---- */
.case-hero{border-radius:12px;padding:16px 18px;border:1px solid var(--line);
  background:linear-gradient(135deg,rgba(74,144,226,.08),rgba(46,204,113,.05))}
.case-hero.fail{background:linear-gradient(135deg,rgba(229,72,77,.1),rgba(245,166,35,.05));border-color:rgba(229,72,77,.35)}
.case-hero.win{background:linear-gradient(135deg,rgba(46,204,113,.1),rgba(80,227,194,.05));border-color:rgba(46,204,113,.35)}
.case-hero.fraud{background:linear-gradient(135deg,rgba(245,166,35,.1),rgba(229,72,77,.06));border-color:rgba(245,166,35,.35)}
.case-tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;
  padding:3px 10px;border-radius:20px;margin-bottom:8px}
.case-tag.fail{background:rgba(229,72,77,.18);color:#f0a0a2}
.case-tag.win{background:rgba(46,204,113,.18);color:#7ee0b0}
.case-tag.fraud{background:rgba(245,166,35,.18);color:var(--gold)}
.case-hero .ch-t{font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.3px}
.case-hero .ch-s{font-size:13px;color:var(--ink2);margin-top:3px}
.discuss{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--purple);
  border-radius:0 10px 10px 0;padding:12px 15px}
.discuss .dq{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--purple);font-weight:700;margin-bottom:8px}
.discuss ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.discuss li{font-size:13.5px;line-height:1.5;color:var(--ink2);padding-left:20px;position:relative}
.discuss li::before{content:'?';position:absolute;left:0;color:var(--purple);font-weight:700}
.upd{display:inline-flex;align-items:center;gap:6px;font-size:11px;
  background:rgba(163,113,247,.12);border:1px dashed rgba(163,113,247,.5);color:#c4a5f7;
  padding:4px 10px;border-radius:7px;margin-top:8px}
.upd::before{content:'✎';font-size:11px}
.lesson{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:11px 13px}
.lesson .li-ico{font-size:18px;flex-shrink:0}
.lesson .li-tx{font-size:13px;line-height:1.5;color:var(--ink2)}
.lesson .li-tx b{color:var(--ink)}

/* ---- tool cards ---- */
.tool{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;padding:13px 15px;text-decoration:none;transition:.15s}
.tool:hover{border-color:var(--exec);transform:translateY(-2px);background:var(--panel2)}
.tool .ti-ico{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:19px;flex-shrink:0}
.tool .ti-body{flex:1;min-width:0}
.tool .ti-name{font-size:15px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:7px}
.tool .ti-name .ext{font-size:11px;color:var(--ink3)}
.tool:hover .ti-name{color:var(--exec)}
.tool .ti-desc{font-size:12.5px;color:var(--ink2);margin-top:3px;line-height:1.45}
.tool .ti-url{font-size:11px;color:var(--exec);font-family:var(--mono);margin-top:5px;word-break:break-all}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ico-hdfs{background:rgba(74,144,226,.15);color:var(--exec)}
.ico-sqoop{background:rgba(245,166,35,.15);color:var(--gold)}
.ico-hive{background:rgba(46,204,113,.15);color:var(--tech)}
.ico-spark{background:rgba(229,72,77,.15);color:var(--danger)}
.ico-bi{background:rgba(163,113,247,.15);color:var(--purple)}
.ico-aqua{background:rgba(80,227,194,.15);color:var(--aqua)}
a.srclink{color:var(--gold);text-decoration:none;border-bottom:1px dotted rgba(245,166,35,.5)}
a.srclink:hover{color:#ffc95c;border-bottom-style:solid}

/* ---- install tutorial ---- */
.winnote{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;background:rgba(74,144,226,.1);
  border:1px solid rgba(74,144,226,.35);color:var(--exec);padding:5px 11px;border-radius:7px;margin-top:8px}
.winnote::before{content:'🪟';font-size:12px}
.oswrap .os-btn{opacity:.6}
.oswrap .os-btn.on{opacity:1;background:var(--exec);border-color:var(--exec);color:#fff}
.os-pane{display:none}
.os-pane.active{display:block}
.tshoot{margin-top:11px;padding:9px 12px;border-radius:8px;background:rgba(245,166,35,.08);
  border:1px solid rgba(245,166,35,.32);font-size:11.5px;line-height:1.55}
.tshoot .tt{font-weight:700;color:var(--gold);font-size:12px}
.tshoot ul{margin:6px 0 0;padding-left:16px;list-style:none}
.tshoot li{margin:4px 0;position:relative}
.tshoot li::before{content:'▹';position:absolute;left:-15px;color:var(--gold)}
.tshoot code{background:rgba(255,255,255,.06);padding:1px 5px;border-radius:4px;font-size:11px}
.step-num{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--panel2);
  border:1px solid var(--line);color:var(--ink2);font-size:11px;font-weight:700;align-items:center;
  justify-content:center;flex-shrink:0;margin-top:1px}
.step{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px}
.step .st-tx{font-size:13px;color:var(--ink2);line-height:1.5}
.verify-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.verify-row:last-child{border-bottom:none}
.verify-row code{font-family:var(--mono);color:var(--tech);font-size:12px}
.verify-row .vok{color:var(--ink3);font-size:11.5px}
kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 7px;
  font-family:var(--mono);font-size:12px;color:var(--ink2)}

/* ---- SVG visuals (offline) ---- */
.viz{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.viz.plain{background:none;border:none;padding:0}
.viz svg{width:100%;height:auto;display:block;overflow:visible}
.viz.compact svg{max-width:168px;margin:0 auto}
/* chip de fonte confirmada (verde ✓) — contrasta com o .src amarelo (⚠ verificar) */
.cite{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:1.35;
  background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.35);color:#7ee0b0;
  padding:3px 9px;border-radius:20px;margin-top:6px;text-decoration:none;cursor:pointer}
.cite::before{content:'✓';font-weight:700}
.cite:hover{border-color:var(--tech);color:#a5f0c8}
/* ---- slide de PAUSA / HORA DO LAB ---- */
.badge.lab{background:rgba(245,166,35,.15);color:var(--gold);border:1px solid rgba(245,166,35,.45)}
.labstop{flex:1;display:flex;flex-direction:column;gap:14px;border-radius:14px;padding:22px 26px;
  background:linear-gradient(135deg,rgba(163,113,247,.12),rgba(245,166,35,.07));
  border:1px solid rgba(163,113,247,.4)}
.ls-badge{display:inline-flex;align-self:flex-start;gap:9px;align-items:center;

/* animated reveal for bars/rings, re-triggers when slide becomes active */
.viz .grow{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}
.slide.active .viz .grow{animation:vgrow .55s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes vgrow{to{transform:scaleY(1)}}
.viz .ring{stroke-dasharray:var(--circ);stroke-dashoffset:var(--circ)}

@keyframes vring{to{stroke-dashoffset:var(--off)}}

<script>
/* =========================================================================
   DECK ENGINE — data-driven. Cada slide é um objeto {kick,title,badge,html}.
   Fatos com números carregam o selo .src ("⚠ VERIFICAR + fonte provável").
   ========================================================================= */
const SRC = (txt) => `<span class="src" title="Número plausível para ensino — confirme na fonte antes de apresentar">${txt}</span>`;
const SRC2 = (t) => `<span class="src" title="Número plausível para ensino — confirme na fonte antes de apresentar">${t}</span>`;
/* fonte confirmada por pesquisa (ago/2026) — chip verde com link opcional */
function CITE(txt,url){return url
  ? `<a class="cite" href="${url}" target="_blank" rel="noopener" title="Fonte verificada">${txt} ↗</a>`
  : `<span class="cite" title="Fonte verificada">${txt}</span>`;}

/* =========================================================================
   MOTOR VISUAL — SVG inline, offline, no tema escuro do deck.
   Funções globais (declarations) → acessíveis nos dois blocos de slides.
   ========================================================================= */
var VC = {exec:'#4a90e2',tech:'#2ecc71',gold:'#f5a623',aqua:'#50e3c2',
  purple:'#a371f7',danger:'#e5484d',ink:'#e6edf3',ink2:'#9fb0c3',
  ink3:'#6b7c91',line:'#2b3444',panel:'#161b22',panel2:'#1c2230'};

/* ---- ícones geométricos (viewBox 24, traço em currentColor) ---- */
var ICON = {
  db:'<ellipse cx="12" cy="6" rx="7" ry="2.6"/><path d="M5 6v12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6V6"/><path d="M5 12c0 1.4 3.1 2.6 7 2.6s7-1.2 7-2.6"/>',
  cluster:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  spark:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  transfer:'<path d="M4 8h13m0 0-3.5-3.5M17 8l-3.5 3.5"/><path d="M20 16H7m0 0 3.5-3.5M7 16l3.5 3.5"/>',
  hive:'<path d="M8 3h8l4 7-4 7H8l-4-7z"/><path d="M9.5 8.5h5l2.2 3.5-2.2 3.5h-5L7.3 12z" opacity=".45"/>',
  chart:'<path d="M4 20V4"/><path d="M4 20h16"/><rect x="7" y="12" width="3" height="5" rx=".6"/><rect x="12" y="8" width="3" height="9" rx=".6"/><rect x="17" y="5" width="3" height="12" rx=".6"/>',
  shield:'<path d="M12 2 4 5v6c0 5 3.4 8.5 8 11 4.6-2.5 8-6 8-11V5z"/><path d="m9 12 2 2 4-4"/>',
  block:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11M15 9v11"/>',
  python:'<path d="M12 3c-3 0-4 1.5-4 3.5V9h4.5M12 3c2.2 0 3.5.7 3.5 2.5V11c0 2-1.3 3-3.5 3H9c-2.2 0-3.5 1-3.5 3v2C5.5 20.5 7 21 9 21"/><circle cx="9.5" cy="6" r=".6" fill="currentColor" stroke="none"/>',
  gauge:'<path d="M4 15a8 8 0 0 1 16 0"/><path d="M12 15l4-4"/><circle cx="12" cy="15" r="1.3" fill="currentColor" stroke="none"/>'
};
function icon(name,color,size){color=color||'currentColor';size=size||22;
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]||''}</svg>`;}
function iconRow(items){/* items:[{i,label,color}] */
  return `<div class="iconrow">${items.map(t=>`<span class="ichip">${icon(t.i,t.color||VC.ink2)}<span class="il">${t.label}</span></span>`).join('')}</div>`;}

/* ---- gráfico de barras verticais ---- */
function barsV(data,opt){opt=opt||{};
  var W=opt.w||360,H=opt.h||156,pl=30,pb=24,pt=22;
  var max=opt.max||Math.max.apply(null,data.map(function(d){return d.value;}));
  var iw=W-pl-8,gap=iw/data.length,bw=Math.min(opt.bw||46,gap*0.6);
  var g='<line x1="'+pl+'" y1="'+(H-pb)+'" x2="'+W+'" y2="'+(H-pb)+'" stroke="'+VC.line+'"/>';
  data.forEach(function(d,i){
    var h=Math.max(2,(d.value/max)*(H-pb-pt));
    var x=pl+i*gap+(gap-bw)/2,y=H-pb-h,c=d.color||VC.exec;
    g+='<rect class="grow" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="4" fill="'+c+'" style="animation-delay:'+(i*0.08)+'s"/>';
    g+='<text x="'+(x+bw/2)+'" y="'+(y-6)+'" fill="'+VC.ink+'" font-size="12.5" font-weight="700" text-anchor="middle">'+(d.top!=null?d.top:d.value)+'</text>';
    g+='<text x="'+(x+bw/2)+'" y="'+(H-pb+15)+'" fill="'+VC.ink3+'" font-size="11" text-anchor="middle">'+d.label+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+(opt.aria||'gráfico de barras')+'">'+g+'</svg>';}

/* ---- donut / ring com número central ---- */
function donut(frac,label,sub,color){color=color||VC.exec;
  var r=46,cx=60,cy=60,circ=2*Math.PI*r,off=circ*(1-Math.max(0,Math.min(1,frac)));
  return '<svg viewBox="0 0 120 120" role="img" aria-label="'+(label||'')+' '+(sub||'')+'">'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+VC.line+'" stroke-width="11"/>'
    +'<circle class="ring" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="11" stroke-linecap="round" transform="rotate(-90 60 60)" style="--circ:'+circ.toFixed(1)+'px;--off:'+off.toFixed(1)+'px"/>'
    +'<text x="60" y="58" fill="'+VC.ink+'" font-size="24" font-weight="800" text-anchor="middle">'+label+'</text>'
    +'<text x="60" y="76" fill="'+VC.ink3+'" font-size="10.5" text-anchor="middle">'+(sub||'')+'</text></svg>';}

/* ---- rede de nós decorativa (hero) ---- */
function heroNet(){
  var pts=[[30,60],[95,30],[110,95],[175,55],[210,105],[250,45],[290,80]];
  var edges=[[0,1],[1,2],[2,3],[1,3],[3,4],[3,5],[5,6],[4,6]];
  var cols=[VC.exec,VC.tech,VC.gold,VC.aqua,VC.purple];
  var e=edges.map(function(p){return '<line x1="'+pts[p[0]][0]+'" y1="'+pts[p[0]][1]+'" x2="'+pts[p[1]][0]+'" y2="'+pts[p[1]][1]+'" stroke="'+VC.line+'" stroke-width="1.5"/>';}).join('');
  var n=pts.map(function(p,i){var c=cols[i%cols.length];
    return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i%3?5:8)+'" fill="'+c+'" opacity="'+(i%3?0.7:1)+'"><animate attributeName="r" values="'+(i%3?5:8)+';'+(i%3?6.5:10)+';'+(i%3?5:8)+'" dur="'+(2.5+i*0.3)+'s" repeatCount="indefinite"/></circle>';}).join('');
  return '<svg viewBox="0 0 320 140" class="hero" role="img" aria-label="Dados conectados em rede">'+e+n+'</svg>';}

/* ---- diagrama de arquitetura Hadoop (ingestão→storage→processamento) ---- */
function hadoopArch(){
  function box(x,y,w,h,c,t,s){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="8" fill="'+c+'22" stroke="'+c+'"/>'
    +'<text x="'+(x+w/2)+'" y="'+(y+h/2-3)+'" fill="'+VC.ink+'" font-size="12.5" font-weight="700" text-anchor="middle">'+t+'</text>'
    +'<text x="'+(x+w/2)+'" y="'+(y+h/2+13)+'" fill="'+VC.ink3+'" font-size="10" text-anchor="middle">'+s+'</text>';}
  var a='<svg viewBox="0 0 360 190" role="img" aria-label="Arquitetura Hadoop: ingestão, armazenamento e processamento">';
  a+=box(10,78,80,44,VC.gold,'Sqoop','ingestão');
  a+='<path d="M92 100h24" stroke="'+VC.ink3+'" stroke-width="1.6" marker-end="url(#ah)"/>';
  a+=box(120,20,150,44,VC.exec,'HDFS','armazenamento 3× réplica');
  a+=box(120,80,150,44,VC.tech,'MapReduce','processamento paralelo');
  a+='<line x1="195" y1="64" x2="195" y2="80" stroke="'+VC.ink3+'" stroke-width="1.6"/>';
  a+=box(120,140,150,40,VC.purple,'YARN','orquestra os recursos');
  a+='<line x1="195" y1="124" x2="195" y2="140" stroke="'+VC.ink3+'" stroke-width="1.6"/>';
  a+='<path d="M272 100h24" stroke="'+VC.ink3+'" stroke-width="1.6" marker-end="url(#ah)"/>';
  a+=box(300,78,50,44,VC.aqua,'Hive','SQL');
  a+='<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0l6 3-6 3z" fill="'+VC.ink3+'"/></marker></defs>';
  return a+'</svg>';}

/* ---- slide de pausa para laboratório ---- */
function labBreak(c){

}

</div>`},

  <div class="col">

    <p class="body"><span class="hl">OLTP</span> (Online Transaction Processing) e <span class="hl">OLAP</span> (Online Analytical Processing) são dois modos de usar dados: um <span class="hl">registra</span> cada operação no instante em que ela acontece; o outro <span class="hl">analisa</span> grandes volumes do histórico para gerar insight.</p>
    <div class="col-label e" style="margin-top:8px">A analogia</div>
    <div class="card"><h3 class="blk">🛒 OLTP = caixa do mercado</h3>
      <p class="body">Atende <span class="hl">um cliente por vez</span>, rápido. "Quem comprou o quê agora." É o sistema que <span class="hl">roda</span> o negócio.</p></div>
    <div class="card"><h3 class="blk">📊 OLAP = análise de vendas</h3>
      <p class="body">Lê <span class="hl">milhões de transações de uma vez</span>. "Quantos fraudadores no trimestre." É o sistema que <span class="hl">entende</span> o negócio.</p></div>
    <p class="note">O curso vive na ponte entre os dois: dados nascem no OLTP, são analisados no OLAP.</p>
  </div>
  <div class="col">
    <div class="col-label t">Comparação técnica</div>
    <table class="cmp">
      <tr><th>Dimensão</th><th>OLTP</th><th>OLAP</th></tr>
      <tr><td>Otimizado p/</td><td>Escrita rápida</td><td>Leitura complexa</td></tr>
      <tr><td>Operações</td><td>Muitas, pequenas</td><td>Poucas, enormes</td></tr>
      <tr><td>Exemplo</td><td>MySQL do app</td><td>Hive no Hadoop</td></tr>
      <tr><td>Latência</td><td>&lt; 1 segundo</td><td>Segundos a min</td></tr>
      <tr><td>Volume</td><td>Registro a registro</td><td>Terabytes</td></tr>
    </table>
    <div class="flow" style="margin-top:6px">
      <div class="node b"><div class="t">MySQL</div><div class="s">OLTP</div></div>
      <span class="arrow">→</span>
      <div class="node o"><div class="t">Sqoop</div><div class="s">ponte</div></div>
      <span class="arrow">→</span>
      <div class="node g"><div class="t">HDFS/Hive</div><div class="s">OLAP</div></div>
    </div>
  </div>
</div>`},

/* ---------- 05 ECOSSISTEMA HADOOP ---------- */
{kick:"Fundamentos", title:"O ecossistema Hadoop", badge:"tech", html:`
<div class="cols">
  <div class="col">
    <div class="col-label e">A ideia central</div>
    <p class="body">Hadoop resolve um problema simples de enunciar e difícil de executar: <span class="hl">guardar e processar mais dados do que cabe em uma máquina</span>. A resposta é sempre a mesma — dividir o trabalho entre muitas máquinas baratas.</p>
    <div class="fact"><div class="ft">Projeto <span class="hl">open-source da Apache</span>, nascido de papers do Google (GFS e MapReduce). Roda em hardware comum, não em servidores caros.</div>${CITE("Google Research — MapReduce (2004)","https://research.google/pubs/mapreduce-simplified-data-processing-on-large-clusters/")}</div>
    <figure class="viz">
      <div class="vtitle">Como as peças se encaixam</div>
      ${hadoopArch()}
    </figure>
  </div>
  <div class="col">
    <div class="col-label t">As 3 camadas que veremos hoje</div>
    <div class="card"><h3 class="blk" style="color:var(--exec)">💾 HDFS — armazenamento</h3>
      <p class="body">Onde os dados moram, distribuídos e replicados.</p></div>
    <div class="card"><h3 class="blk" style="color:var(--tech)">⚙️ MapReduce — processamento</h3>
      <p class="body">Como o trabalho é dividido e executado em paralelo.</p></div>
    <div class="card"><h3 class="blk" style="color:var(--gold)">🔀 Sqoop — ingestão</h3>
      <p class="body">Como os dados do banco SQL chegam ao HDFS.</p></div>
  </div>
</div>`},

/* ---------- INST 2 · Java & SSH ---------- */
{kick:"Instalação", title:"Passo 1 — Java e SSH", badge:"tech", html:`
<div class="cols">
  <div class="col">
    <div class="col-label e">Por que precisa disso</div>
    <div class="step"><span class="step-num">1</span><div class="st-tx">Hadoop, Hive e Spark rodam sobre a <span class="hl">JVM</span> — sem Java, nada sobe.</div></div>
    <div class="step"><span class="step-num">2</span><div class="st-tx">HDFS coordena seus próprios processos via <span class="hl">SSH local</span>, mesmo numa única máquina.</div></div>
    <div class="step"><span class="step-num">3</span><div class="st-tx">Configurar SSH <span class="hl">sem senha</span> evita que o cluster peça login a cada comando.</div></div>
    <div class="winnote">Dentro do WSL2 (Ubuntu), use exatamente os comandos ao lado</div>
  </div>
  <div class="col">
    <div class="col-label t">Terminal</div>
    <div class="oswrap term-cmds" style="margin:0 0 9px">
      <button class="btn os-btn on" data-os="linux">🐧 Linux</button>
      <button class="btn os-btn" data-os="windows">🪟 Windows · WSL2</button>
      <button class="btn os-btn" data-os="colab">🟠 Colab</button>
    </div>
    <div class="os-pane active" data-os="linux"><p class="note" style="margin:0 0 7px">Rode direto no seu terminal Linux (Ubuntu/Debian).</p></div>
    <div class="os-pane" data-os="windows"><div class="winnote" style="margin:0 0 7px">Abra o <b>Ubuntu (WSL2)</b> — Iniciar → Ubuntu — e rode os mesmos comandos.</div></div>
    <div class="os-pane active" data-os="linux windows"><pre class="code"><span class="cm"># Java 11 + servidor SSH</span>
sudo apt update
sudo apt install -y openjdk-11-jdk openssh-server
java -version

<span class="cm"># chave SSH sem senha, para localhost</span>
ssh-keygen -t rsa -P '' -f ~/.ssh/id_rsa
cat ~/.ssh/id_rsa.pub >> ~/.ssh/authorized_keys
chmod 600 ~/.ssh/authorized_keys

<span class="cm"># deve conectar sem pedir senha:</span>

<span class="cm"># ── troubleshooting Java ──────────────────────</span>

readlink -f $(which java)                <span class="cm"># caminho real; JAVA_HOME = isso menos /bin/java</span>

<span class="cm"># corrige "JAVA_HOME is not set" (erro do Hadoop):</span>

<span class="nm">!</span>java -version</pre></div>
  </div>
</div>`},

/* ---------- INST 3 · Hadoop/HDFS ---------- */
{kick:"Instalação", title:"Passo 2 — Hadoop / HDFS", badge:"tech", html:`
<div class="cols">
  <div class="col">
    <div class="col-label e">O que vamos configurar</div>
    <p class="body">Instalação <span class="hl">pseudo-distribuída</span>: todos os papéis (NameNode, DataNode) rodam na mesma máquina — perfeito para aprender antes de ir a um cluster real.</p>
    <ul class="list t">
      <li>Baixar e extrair o binário oficial</li>
      <li>Definir <kbd>HADOOP_HOME</kbd> no PATH</li>
      <li>Editar <kbd>core-site.xml</kbd> e <kbd>hdfs-site.xml</kbd></li>
      <li>Formatar o NameNode <span class="hl">uma única vez</span></li>
    </ul>
    <p class="note">⚠ Confira a versão mais recente em hadoop.apache.org/releases.html antes de baixar.</p>
  </div>
  <div class="col">
    <div class="col-label t">Terminal</div>
    <div class="oswrap term-cmds" style="margin:0 0 9px">
      <button class="btn os-btn on" data-os="linux">🐧 Linux</button>
      <button class="btn os-btn" data-os="windows">🪟 Windows · WSL2</button>
      <button class="btn os-btn" data-os="colab">🟠 Colab</button>
    </div>
    <div class="os-pane active" data-os="linux"><p class="note" style="margin:0 0 7px">Rode direto no seu terminal Linux (Ubuntu/Debian).</p></div>
    <div class="os-pane" data-os="windows"><div class="winnote" style="margin:0 0 7px">Abra o <b>Ubuntu (WSL2)</b> — Iniciar → Ubuntu — e rode os mesmos comandos.</div></div>
    <div class="os-pane active" data-os="linux windows"><pre class="code"><span class="cm"># 0) pré-requisitos: Java 8/11 + SSH + utilitários que o Hadoop usa</span>
sudo apt update &amp;&amp; sudo apt install -y openjdk-11-jdk ssh
sudo apt install -y hostname net-tools   <span class="cm"># start-dfs.sh/jps precisam de hostname e netstat</span>

<span class="cm"># 1) baixar e instalar (archive = link estável p/ versão fixa)</span>
wget https://archive.apache.org/dist/hadoop/common/hadoop-3.3.6/hadoop-3.3.6.tar.gz
tar -xzf hadoop-3.3.6.tar.gz
sudo mv hadoop-3.3.6 /opt/hadoop
sudo chown -R $USER:$USER /opt/hadoop   <span class="cm"># senão o format falha por permissão</span>

<span class="cm"># 2) variáveis de ambiente (~/.bashrc)</span>
<span class="cm"># descubra onde o Java está — esse caminho é o seu JAVA_HOME:</span>
readlink -f $(which java) | sed 's/\/bin\/java//'
echo 'export JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))' >> ~/.bashrc
echo 'export HADOOP_HOME=/opt/hadoop' >> ~/.bashrc
echo 'export PATH=$PATH:$HADOOP_HOME/bin:$HADOOP_HOME/sbin' >> ~/.bashrc
source ~/.bashrc

<span class="cm"># 3) dizer ao Hadoop onde está o Java (senão: "JAVA_HOME is not set")</span>
echo "export JAVA_HOME=$JAVA_HOME" >> $HADOOP_HOME/etc/hadoop/hadoop-env.sh

<span class="cm"># 4) core-site.xml — endereço do HDFS</span>
cat &gt; $HADOOP_HOME/etc/hadoop/core-site.xml &lt;&lt;'EOF'
&lt;configuration&gt;
  &lt;property&gt;&lt;name&gt;fs.defaultFS&lt;/name&gt;&lt;value&gt;hdfs://localhost:9000&lt;/value&gt;&lt;/property&gt;
&lt;/configuration&gt;
EOF

<span class="cm"># 5) hdfs-site.xml — 1 réplica (máquina única) + diretórios</span>
cat &gt; $HADOOP_HOME/etc/hadoop/hdfs-site.xml &lt;&lt;'EOF'
&lt;configuration&gt;
  &lt;property&gt;&lt;name&gt;dfs.replication&lt;/name&gt;&lt;value&gt;1&lt;/value&gt;&lt;/property&gt;
  &lt;property&gt;&lt;name&gt;dfs.namenode.name.dir&lt;/name&gt;&lt;value&gt;/opt/hadoop/data/nn&lt;/value&gt;&lt;/property&gt;
  &lt;property&gt;&lt;name&gt;dfs.datanode.data.dir&lt;/name&gt;&lt;value&gt;/opt/hadoop/data/dn&lt;/value&gt;&lt;/property&gt;
&lt;/configuration&gt;
EOF

<span class="cm"># 6) SSH sem senha p/ localhost (start-dfs.sh exige)</span>
ssh-keygen -t rsa -P '' -f ~/.ssh/id_rsa &lt;&lt;&lt; y
cat ~/.ssh/id_rsa.pub &gt;&gt; ~/.ssh/authorized_keys
chmod 600 ~/.ssh/authorized_keys
sudo service ssh start   <span class="cm"># no WSL2 o ssh não sobe sozinho</span>

<span class="cm"># 7) formatar o NameNode (UMA vez só) e subir o HDFS</span>
hdfs namenode -format
start-dfs.sh
jps   <span class="cm"># deve listar NameNode, DataNode e SecondaryNameNode</span></pre></div>
    <div class="os-pane" data-os="colab"><p class="note" style="margin:0 0 7px">Numa célula do Colab (roda como root — sem sudo, e as variáveis vão em <kbd>os.environ</kbd>):</p><pre class="code"><span class="kw">import</span> os
<span class="cm"># baixar e extrair</span>
<span class="nm">!</span>wget -q -O hadoop-3.3.6.tar.gz https://archive.apache.org/dist/hadoop/common/hadoop-3.3.6/hadoop-3.3.6.tar.gz
<span class="nm">!</span>tar -xzf hadoop-3.3.6.tar.gz -C /content/

<span class="cm"># variáveis de ambiente (persistem na sessão)</span>
os.environ[<span class="st">"HADOOP_HOME"</span>] = <span class="st">"/content/hadoop-3.3.6"</span>
os.environ[<span class="st">"PATH"</span>] += <span class="st">f":{os.environ['HADOOP_HOME']}/bin"</span>
<span class="nm">!</span>hadoop version</pre></div>
  </div>
</div>`},

/* ========== WIDGETS DOS SLIDES 7–20 ========== */
function runWidgetsPart2(i){
  // ---- Terminal HDFS (slide 7 index) ----
  const out=document.getElementById('termOut');
  if(out){
    const responses={
      ls:`<div><span class="pr">$</span> <span class="out">hadoop fs -ls /user/bigdata/raw</span></div>
<div class="dim">Found 3 items</div>
<div class="out">drwxr-xr-x   - bigdata sup  /user/bigdata/raw/customers</div>
<div class="out">drwxr-xr-x   - bigdata sup  /user/bigdata/raw/transactions</div>
<div class="out">drwxr-xr-x   - bigdata sup  /user/bigdata/raw/fraud_labels</div>`,
      put:`<div><span class="pr">$</span> <span class="out">hadoop fs -put transactions.csv /user/bigdata/raw/</span></div>
<div class="dim">...enviando 7.8 MB</div>
<div class="out">✓ upload completo · split em 1 bloco · replicado 3×</div>`,
      fsck:`<div><span class="pr">$</span> <span class="out">hdfs fsck /user/bigdata/raw/transactions -files -blocks</span></div>
<div class="out">Total size:    7.8 MB</div>
<div class="out">Total blocks:  1</div>
<div class="out">Replication:   <span class="warn">3</span>  ✓</div>
<div class="dim">Status: HEALTHY</div>`,
      du:`<div><span class="pr">$</span> <span class="out">hadoop fs -du -s -h /user/bigdata/raw</span></div>
<div class="out">8.8 M   26.4 M   /user/bigdata/raw</div>
<div class="dim">(tamanho lógico | com replicação 3×)</div>`,
      clear:`<span class="dim">Clique em um comando abaixo ↓</span>`
    };
    document.querySelectorAll('.btn[data-cmd]').forEach(b=>{
      b.onclick=()=>{ out.innerHTML=responses[b.dataset.cmd]; out.scrollTop=out.scrollHeight; };
    });
  }

  // ---- MapReduce stages (slide 8 index) ----
  const mrStage=document.getElementById('mrStage');
  if(mrStage){
    const stages={
      map:`<div class="warn" style="margin-bottom:6px">FASE 1 · MAP (paralelo)</div>
tx(compra, fraude=Y) → <span style="color:#7ee787">emit("compra",1)</span><br>
tx(saque,&nbsp; fraude=Y) → <span style="color:#7ee787">emit("saque",1)</span><br>
tx(compra, fraude=N) → <span class="dim">skip</span><br>
tx(compra, fraude=Y) → <span style="color:#7ee787">emit("compra",1)</span>`,
      shuffle:`<div class="warn" style="margin-bottom:6px">FASE 2 · SHUFFLE (agrupa por chave)</div>
"compra" → [1, 1]<br>
"saque"&nbsp; → [1]<br>
"transferencia" → [1, 1, 1]`,
      reduce:`<div class="warn" style="margin-bottom:6px">FASE 3 · REDUCE (soma)</div>
"compra"&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= <span style="color:#f5a623">2</span><br>
"saque"&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= <span style="color:#f5a623">1</span><br>
"transferencia" = <span style="color:#f5a623">3</span>
<div class="dim" style="margin-top:6px">— total: 6 fraudes contadas —</div>`
    };
    const g=(id,s)=>{const b=document.getElementById(id); if(b)b.onclick=()=>{mrStage.innerHTML=s;};};
    g('mr1',stages.map); g('mr2',stages.shuffle); g('mr3',stages.reduce);
    const r=document.getElementById('mrReset');
    if(r)r.onclick=()=>{mrStage.innerHTML='<span class="dim">Pronto. Clique em "1 · Map" para começar.</span>';};
  }

  // ---- Quizzes (slides 10 & 17 index) ----
  function wireQuiz(qid,fbid,okMsg,noMsg){
    const box=document.getElementById(qid); if(!box)return;
    const fb=document.getElementById(fbid);
    box.querySelectorAll('.quiz-opt').forEach(opt=>{
      opt.onclick=()=>{
        if(box.dataset.done)return;
        box.dataset.done='1';
        const ok=opt.dataset.ok==='1';
        opt.classList.add(ok?'correct':'wrong');
        if(!ok){ box.querySelector('[data-ok="1"]').classList.add('correct'); }
        fb.className='quiz-fb show '+(ok?'ok':'no');
        fb.innerHTML=ok?okMsg:noMsg;
      };
    });
  }
  wireQuiz('q1','q1fb','✓ Isso. Com 3 cópias, você sobrevive à perda de 2 nós simultâneos.',
    '✕ Com replicação 3×, restam cópias mesmo perdendo 2 DataNodes ao mesmo tempo.');
  wireQuiz('q2','q2fb','✓ Exato. O Shuffle agrupa todos os valores de cada chave antes do Reduce.',
    '✕ É o Shuffle — ele junta por chave entre o Map e o Reduce.');
  wireQuiz('q3','q3fb','✓ Correto. Cadastro muda, então lastmodified + merge-key mantém a versão certa.',
    '✕ Como o cadastro é atualizado, use lastmodified + merge-key (append só serve p/ tabelas que crescem).');
  wireQuiz('q4','q4fb','✓ Isso. -m define quantos mappers rodam em paralelo.',
    '✕ -m é o número de mappers paralelos, não tamanho nem tempo.');

  // ---- Sqoop builder (slide 12 index) ----
  const sqOut=document.getElementById('sqOut');
  if(sqOut){
    const build=()=>{
      const on=k=>document.querySelector(`.sq[data-k="${k}"]`)?.checked;
      let L=[`<span class="fn">sqoop</span> import \\`,
        `  <span class="kw">--connect</span> <span class="st">jdbc:mysql://localhost:3306/bigdata</span> \\`,
        `  <span class="kw">--username</span> <span class="nm">root</span> <span class="kw">--password</span> <span class="nm">****</span> \\`,
        `  <span class="kw">--table</span> <span class="nm">customers</span> \\`,
        `  <span class="kw">--target-dir</span> <span class="st">/user/bigdata/raw/customers</span> \\`];
      if(on('incr')) L.push(`  <span class="kw">--incremental</span> lastmodified <span class="kw">--check-column</span> updated_at \\`);
      if(on('nulls')) L.push(`  <span class="kw">--null-string</span> <span class="st">'\\\\N'</span> <span class="kw">--null-non-string</span> <span class="st">'\\\\N'</span> \\`);
      if(on('parquet')) L.push(`  <span class="kw">--as-parquetfile</span> \\`);
      L.push(`  <span class="kw">-m</span> <span class="nm">${on('parallel')?4:1}</span>`);
      sqOut.innerHTML=L.join('\n');
    };
    document.querySelectorAll('.sq').forEach(c=>c.onchange=build);
    build();
    const cp=document.getElementById('sqCopy');
    if(cp)cp.onclick=()=>{
      navigator.clipboard?.writeText(sqOut.innerText).then(()=>{
        cp.textContent='✓ copiado!'; setTimeout(()=>cp.textContent='⧉ copiar comando',1500);
      }).catch(()=>{cp.textContent='selecione e copie manualmente';});
    };
  }
}
</script>

<script>
/* =========================================================================
   RENDER + NAVEGAÇÃO
   ========================================================================= */
let cur=0;
const wrap=document.getElementById('slideWrap');
const tocGrid=document.getElementById('tocGrid');

function badgeLabel(b){return b==='exec'?'EXEC':b==='tech'?'TECH':b==='lab'?'LAB':'MIX';}

function buildSlides(){
  slides.forEach((s,i)=>{
    const el=document.createElement('section');
    el.className='slide'; el.id='slide'+i;
    el.innerHTML=`<div class="sfit">${s.cover?'':`
      <div class="shead">
        <div class="badge ${s.badge}">${String(i+1).padStart(2,'0')}</div>
        <div><div class="kick">${s.kick} · ${badgeLabel(s.badge)}</div><h2>${s.title}</h2></div>
      </div>`}${s.html}</div>`;
    wrap.appendChild(el);

    const t=document.createElement('div');
    t.className='toc-item';
    t.innerHTML=`<span class="tn">${String(i+1).padStart(2,'0')}</span><span class="tt">${s.title}</span>`;
    t.onclick=()=>{show(i);toggleToc();};
    tocGrid.appendChild(t);
  });
}

function show(i){
  document.getElementById('slide'+cur)?.classList.remove('active');
  cur=Math.max(0,Math.min(slides.length-1,i));
  document.getElementById('slide'+cur).classList.add('active');
  document.getElementById('bar').style.width=((cur+1)/slides.length*100)+'%';
  document.getElementById('counter').innerHTML=`<b>${cur+1}</b> / ${slides.length}`;
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===slides.length-1;
  wireWidgets(cur);
}
function go(d){show(cur+d);}
function toggleToc(){document.getElementById('toc').classList.toggle('open');}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(1);
  if(e.key==='ArrowLeft')go(-1);
  if(e.key==='Escape')document.getElementById('toc').classList.remove('open');
});

/* toggle genérico Windows/Linux (delegado — funciona em qualquer slide) */
wrap.addEventListener('click',e=>{

/* =========================================================================
   WIDGET WIRING — reconecta interações cada vez que o slide aparece
   ========================================================================= */
function wireWidgets(i){
  // --- 4 Vs (slide index 2) ---
  const vData=[
    {t:'📦 Volume — quanto',c:'var(--exec)',b:'100 mil transações por dia viram mais de 36 milhões por ano. Um laço em uma máquina levaria horas; distribuído, minutos.',e:'<div class="stat b"><div class="n">36M+</div><div class="l">transações/ano no caso-guia</div></div>'},
    {t:'⚡ Velocity — quão rápido',c:'var(--tech)',b:'O dado perde valor com o tempo. Fraude detectada em 2 dias é prejuízo; em 2 segundos, é bloqueio.',e:'<div class="stat g"><div class="n">&lt;1s</div><div class="l">meta de latência para alerta</div></div>'},
    {t:'🔀 Variety — que tipos',c:'var(--gold)',b:'Transações estruturadas (SQL), logs semiestruturados (JSON), documentos não estruturados (imagens/OCR). Tudo precisa conviver.',e:'<div class="two"><span class="tag">SQL</span><span class="tag">JSON</span><span class="tag">CSV</span><span class="tag">Imagem</span></div>'},
    {t:'✔ Veracity — confiável?',c:'var(--aqua)',b:'Dado sujo gera decisão errada. Nulos, duplicatas e inconsistências precisam de um pipeline de qualidade — é o que faremos no DIA 2 (camada Bronze).',e:'<div class="stat a"><div class="n">"lixo→lixo"</div><div class="l">garbage in, garbage out</div></div>'},
  ];
  document.querySelectorAll('.vbtn').forEach(btn=>{
    btn.onclick=()=>{
      const d=vData[+btn.dataset.v];
      document.getElementById('vTitle').textContent=d.t;
      document.getElementById('vTitle').style.color=d.c;
      document.getElementById('vBody').textContent=d.b;
      document.getElementById('vExtra').innerHTML=d.e;
      document.querySelectorAll('.vbtn').forEach(x=>x.style.borderColor='var(--line)');
      btn.style.borderColor=d.c;
    };
  });

  // --- HDFS replication slider (slide index 5) ---
  const rep=document.getElementById('hdRep');
  if(rep){
    const upd=()=>{
      const r=+rep.value, size=100;
      document.getElementById('hdRepVal').textContent=r;
      document.getElementById('hdUsed').textContent=(size*r)+' GB';
      const msgs={
        1:'Sem redundância. Um disco falha e o dado some. Nunca use em produção.',
        2:'Sobrevive a 1 falha. Economiza espaço, mas margem apertada.',
        3:'Padrão do HDFS. Sobrevive à perda de 2 servidores simultâneos sem perder dados.',
        4:'Extra-seguro. Custa 33% mais espaço que o padrão, ganho marginal.',
        5:'Raro. Só para dados críticos e clusters muito grandes.'};
      document.getElementById('hdMsg').textContent=msgs[r];
      document.getElementById('hdRepVal').style.color=r<2?'var(--danger)':r===3?'var(--exec)':'var(--gold)';
    };
    rep.oninput=upd; upd();
  }

  runWidgetsPart2 && runWidgetsPart2(i);
}

buildSlides();
document.getElementById('tocTitle').textContent='DIA 1 — Fundamentos & Ingestão · '+slides.length+' slides';
show(0);
</script>

<!-- copy-to-clipboard nos blocos de código -->
<style>
.code-wrap{position:relative}
.copy-btn{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:5px;
  padding:4px 8px;font:600 11px/1 var(--mono,monospace);color:#c9d6e5;
  background:rgba(255,255,255,.06);border:1px solid var(--line,#2a3441);border-radius:7px;
  cursor:pointer;opacity:0;transition:opacity .15s,background .15s,color .15s;z-index:2}
.code-wrap:hover .copy-btn{opacity:1}
.copy-btn:hover{background:rgba(255,255,255,.12)}
.copy-btn.ok{color:#7ee787;border-color:#2ea04366}
</style>
<script>
(function(){
  function label(b,txt,cls){b.querySelector('span').textContent=txt;b.className='copy-btn'+(cls?' '+cls:'');}
  function addBtns(root){
    (root||document).querySelectorAll('pre.code').forEach(function(pre){
      if(pre.parentElement.classList.contains('code-wrap'))return;
      var wrap=document.createElement('div');wrap.className='code-wrap';
      pre.parentNode.insertBefore(wrap,pre);wrap.appendChild(pre);
      var b=document.createElement('button');b.className='copy-btn';b.type='button';
      b.innerHTML='<span>📋 copiar</span>';
      b.addEventListener('click',function(){
        var t=pre.innerText.replace(/\s+$/,'');
        navigator.clipboard.writeText(t).then(function(){
          label(b,'✓ copiado','ok');setTimeout(function(){label(b,'📋 copiar');},1400);
        }).catch(function(){label(b,'erro');setTimeout(function(){label(b,'📋 copiar');},1400);});
      });
      wrap.appendChild(b);
    });
  }
  addBtns();
  new MutationObserver(function(m){m.forEach(function(x){if(x.addedNodes.length)addBtns();});})
    .observe(document.body,{childList:true,subtree:true});
})();
</script>

<!-- auto-fit de conteúdo + barra inferior com auto-hide -->
<script>
function fitSlide(){
  var s=document.querySelector('.slide.active'); if(!s) return;
  var f=s.querySelector('.sfit'); if(!f) return;
  f.style.transform='none'; f.style.width='';
  var availH=f.clientHeight, availW=f.clientWidth;
  var needH=f.scrollHeight, needW=f.scrollWidth, sc=1;
  if(needH>availH+1) sc=Math.min(sc, availH/needH);
  if(needW>availW+1) sc=Math.min(sc, availW/needW);
  if(sc<1){ sc=Math.max(0.5, sc);
    f.style.width=(100/sc)+'%'; f.style.transform='scale('+sc+')'; }
}
(function(){
  var wrap=document.getElementById('slideWrap');
  if(wrap){
    new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        var t=muts[i].target;
        if(t.classList && t.classList.contains('active')){ requestAnimationFrame(fitSlide); break; }
      }
    }).observe(wrap,{attributes:true,attributeFilter:['class'],subtree:true});
    wrap.addEventListener('click',function(){ requestAnimationFrame(fitSlide); });
  }
  window.addEventListener('resize',function(){ requestAnimationFrame(fitSlide); });
  window.addEventListener('load',function(){ requestAnimationFrame(fitSlide); });
  requestAnimationFrame(fitSlide);
  var foot=document.getElementById('foot');
  if(foot) document.addEventListener('mousemove',function(e){
    foot.classList.toggle('show', e.clientY > window.innerHeight-72);
  });
})();
</script>
